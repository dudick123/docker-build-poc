server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── Angular HTML5 routing ────────────────────────────────────────────────
    # Angular uses the HTML5 History API (pushState) for client-side routing.
    # When a user navigates directly to a deep link (e.g., /admin/users) or
    # refreshes the page, nginx must serve index.html for any path that does
    # not correspond to an existing static file.
    #
    # try_files $uri $uri/ /index.html:
    #   1. Try to serve the exact file ($uri)
    #   2. Try to serve the directory index ($uri/)
    #   3. Fall back to serving index.html for all other paths
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Static asset caching ─────────────────────────────────────────────────
    # Angular's production build generates filenames with content hashes
    # (e.g., main.a3f9e21b.js). These files are immutable — if the content
    # changes, the filename changes. Setting a long cache lifetime is safe and
    # dramatically reduces repeat page-load times for returning users.
    #
    # 'immutable' tells browsers the file content will NEVER change at this URL.
    # Browsers that support this directive skip even the conditional (304) check.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── Security headers ─────────────────────────────────────────────────────
    # These headers harden the application against common web vulnerabilities.
    # Adjust the Content-Security-Policy to match your application's requirements
    # (which APIs, CDNs, and image sources it needs to connect to).
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # ── Compression ──────────────────────────────────────────────────────────
    # Enable gzip compression for text-based assets.
    # Angular bundles can be 200–500KB before compression; gzip reduces this
    # by 60–80%. This is one of the highest-impact performance optimizations
    # available at the nginx layer.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               image/svg+xml;

    # ── Health check endpoint ─────────────────────────────────────────────────
    # Kubernetes liveness and readiness probes can use this endpoint.
    # Returns 200 with no body. Does not log to access_log.
    location /healthz {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }
}
